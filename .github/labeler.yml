# 按 PR 改动路径自动打标（配合 actions/labeler@v5）
# lang:* / status:* / r:* 标签由审核者手动添加

type: food:
  - changed-files:
      - any-glob-to-any-file:
          - 'content/**/foods/**'

type: product:
  - changed-files:
      - any-glob-to-any-file:
          - 'content/**/products/**'

type: recipe:
  - changed-files:
      - any-glob-to-any-file:
          - 'content/**/recipes/**'

type: concept-guide:
  - changed-files:
      - any-glob-to-any-file:
          - 'content/**/concepts/**'
          - 'content/**/guides/**'

type: site:
  - changed-files:
      - any-glob-to-any-file:
          - 'build.py'
          - 'requirements.txt'
          - 'robots.txt'
          - 'assets/**'
          - '.github/**'

lang: bilingual:
  - changed-files:
      - all-globs-to-any-file:
          - 'content/zh/**'
          - 'content/en/**'
